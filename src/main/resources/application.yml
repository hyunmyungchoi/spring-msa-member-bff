server:
  port: 8079
  servlet:
    session:
      cookie:
        name: BFFSESSIONID
        http-only: true
        same-site: lax

spring:
  application:
    name: spring-member-bff-service

  flyway:
    default-schema: member_bff
    schemas: member_bff
    create-schemas: true

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: member_bff

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.springmsa.kafka.event
    listener:
      ack-mode: record

  session:
    store-type: redis
    data:
      redis:
        namespace: spring:session:bff

  security:
    oauth2:
      client:
        registration:
          member-bff:
            provider: member-auth-server
            client-id: ${BFF_CLIENT_ID}
            client-secret: ${BFF_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: ${BFF_OAUTH2_REDIRECT_URI}
            scope:
              - openid
              - profile
        provider:
          member-auth-server:
            authorization-uri: ${BFF_OAUTH2_AUTHORIZATION_URI}
            token-uri: ${BFF_OAUTH2_TOKEN_URI}
            user-info-uri: ${BFF_OAUTH2_USERINFO_URI}
            jwk-set-uri: ${BFF_OAUTH2_JWK_SET_URI}
            user-name-attribute: sub

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

logging:
  charset:
    console: UTF-8
  level:
    com.springmsa.memberbff: debug

app:
  kafka:
    enabled: ${APP_KAFKA_ENABLED:false}

springmsa:
  internal-api:
    header-name: X-Internal-Token
    token: ${SPRING_MSA_INTERNAL_API_TOKEN}

bff:
  frontend:
    redirect-uri: ${BFF_FRONTEND_REDIRECT_URI}
  oauth2:
    end-session-uri: ${BFF_OAUTH2_END_SESSION_URI}
    logout-uri: ${BFF_OAUTH2_LOGOUT_URI}
  api:
    user-api-base-url: ${BFF_API_USER_API_BASE_URL}
    user-internal-base-url: ${BFF_API_USER_INTERNAL_BASE_URL}
    community-api-base-url: ${BFF_API_COMMUNITY_API_BASE_URL}
    stock-api-base-url: ${BFF_API_STOCK_API_BASE_URL}
  presence:
    redis:
      namespace: spring:presence:member-bff
    heartbeat:
      ttl-seconds: 45
    stream:
      key: spring:presence:member-bff:events
      max-length: 1000
  chat:
    pubsub:
      channel: spring:chat:broadcast
    cache:
      recent-messages:
        enabled: true
        namespace: spring:chat:cache
        max-size: 200
        ttl-seconds: 3600
    message:
      default-history-limit: 50
      max-content-length: 1000
  kafka:
    topics:
      partitions: 3
      replicas: 1
    retry:
      interval-ms: 1000
      max-attempts: 3
    outbox:
      batch-size: 100
      fixed-delay-ms: 1000
      send-timeout-seconds: 10
    consumer:
      notification-group: spring-member-bff-chat-notification
      analytics-group: spring-member-bff-chat-analytics
      dlt-group: spring-member-bff-chat-dlt
